    <!-- Custom Login JS -->
    <script>
      function showAlert(msg, type) {
        const el = document.getElementById('authAlert');
        if (!el) return;
        el.className = `alert alert-${type} mb-4 py-2 px-3 small`;
        el.textContent = msg;
        el.classList.remove('d-none');
      }

      function handleAuthSuccess(data) {
        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        }
      }

      function handleGoogleLoginResponse(response) {
        if (!response || !response.credential) {
          showAlert('Gagal menerima kredensial akun Google', 'danger');
          return;
        }

        fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success && data.token) {
              handleAuthSuccess(data);
            } else {
              showAlert(data.message || 'Login dengan Google gagal', 'danger');
            }
          })
          .catch(err => showAlert('Gagal menghubungi server backend: ' + err.message, 'danger'));
      }

      function doLogin() {
        const emailInput = (document.getElementById('email')?.value || '').trim();
        const passInput = document.getElementById('password')?.value || '';
        const btnSignIn = document.getElementById('btnSignIn');

        if (!emailInput || !passInput) {
          showAlert('Harap isi email/username dan password', 'warning');
          return;
        }

        if (btnSignIn) {
          btnSignIn.disabled = true;
          btnSignIn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...';
        }

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username_or_email: emailInput, password: passInput })
        })
          .then(res => res.json())
          .then(data => {
            if (btnSignIn) {
              btnSignIn.disabled = false;
              btnSignIn.textContent = 'Masuk';
            }
            if (data.success && data.token) {
              showAlert('Login berhasil! Mengalihkan ke dashboard...', 'success');
              handleAuthSuccess(data);
            } else {
              showAlert(data.message || 'Login gagal, periksa email/username dan password Anda', 'danger');
            }
          })
          .catch(err => {
            if (btnSignIn) {
              btnSignIn.disabled = false;
              btnSignIn.textContent = 'Masuk';
            }
            showAlert('Tidak dapat terhubung ke server backend: ' + err.message, 'danger');
          });
      }

      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('formAuthentication');
        const btnSignIn = document.getElementById('btnSignIn');
        const emailEl = document.getElementById('email');
        const passEl = document.getElementById('password');

        if (btnSignIn) {
          btnSignIn.addEventListener('click', function(e) {
            e.preventDefault();
            doLogin();
          });
        }

        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            e.stopPropagation();
            doLogin();
            return false;
          });
        }

        [emailEl, passEl].forEach(input => {
          if (input) {
            input.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                doLogin();
              }
            });
          }
        });
      });
    </script>
